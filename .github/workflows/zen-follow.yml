# Follows upstream release tags one at a time: rebase zen/main, test, push, release.
# Any failure fails the run and disables this workflow until the owner re-enables it.
name: zen-follow

on:
   schedule:
      - cron: '17 * * * *'
   workflow_dispatch:

concurrency:
   group: zen-follow
   cancel-in-progress: false

permissions:
   contents: read
   actions: write

env:
   UPSTREAM_URL: https://github.com/can1357/oh-my-pi.git
   GH_TOKEN: ${{ github.token }}

jobs:
   follow:
      runs-on: ubuntu-24.04
      steps:
         - name: Require ZEN_DEPLOY_KEY
           env:
              DEPLOY_KEY: ${{ secrets.ZEN_DEPLOY_KEY }}
           run: |
              if [ -z "$DEPLOY_KEY" ]; then
                 echo "::error::Repository secret ZEN_DEPLOY_KEY is missing (write deploy key)."
                 exit 1
              fi

         # The deploy key (not GITHUB_TOKEN) pushes over SSH: upstream tags can touch .github/workflows/.
         - uses: actions/checkout@v4
           with:
              ref: zen/main
              fetch-depth: 0
              ssh-key: ${{ secrets.ZEN_DEPLOY_KEY }}
         - uses: oven-sh/setup-bun@v2

         - name: Select next upstream tag
           id: select
           run: |
              git fetch --no-tags "$UPSTREAM_URL" '+refs/tags/v*:refs/tags/v*'
              bun scripts/zen/follow.ts select --ref zen/main --upstream "$UPSTREAM_URL" | tee -a "$GITHUB_OUTPUT"

         # Upstream tags before npm publishes the matching addons cannot be released yet.
         - name: Check upstream npm release is published
           id: ready
           if: steps.select.outputs.next != ''
           env:
              NEXT: ${{ steps.select.outputs.next }}
           run: |
              version="${NEXT#v}"
              ready=true
              for tag in linux-x64 darwin-arm64 linux-arm64; do
                 if ! npm view "@oh-my-pi/pi-natives-$tag@$version" version >/dev/null 2>&1; then
                    echo "@oh-my-pi/pi-natives-$tag@$version is not on npm yet"
                    ready=false
                 fi
              done
              echo "ready=$ready" >> "$GITHUB_OUTPUT"
              [ "$ready" = true ] || echo "Skipping $NEXT until upstream publishes it." >> "$GITHUB_STEP_SUMMARY"

         - name: Rebase zen/main onto the new tag
           id: rebase
           if: steps.ready.outputs.ready == 'true'
           env:
              BASE: ${{ steps.select.outputs.base }}
              NEXT: ${{ steps.select.outputs.next }}
           run: |
              git config user.name cagedbird043
              git config user.email cagedbird043@gmail.com
              echo "old=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              scripts/zen/rebase-onto.sh "$BASE" "$NEXT" zen/main
              echo "new=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

         - name: Restore bun store
           if: steps.ready.outputs.ready == 'true'
           uses: actions/cache@v4
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: bun-${{ runner.os }}-
         - name: Install dependencies
           if: steps.ready.outputs.ready == 'true'
           run: bun install --frozen-lockfile

         # The tests load pi-natives; the official same-version addon avoids a Rust build.
         - name: Fetch official linux-x64 addon for tests
           if: steps.ready.outputs.ready == 'true'
           env:
              NEXT: ${{ steps.select.outputs.next }}
           run: |
              tmp="$(mktemp -d)"
              tarball="$(npm pack "@oh-my-pi/pi-natives-linux-x64@${NEXT#v}" --ignore-scripts --pack-destination "$tmp" | tail -n1)"
              tar -xzf "$tmp/$tarball" -C "$tmp" package/pi_natives.linux-x64-modern.node
              cp "$tmp/package/pi_natives.linux-x64-modern.node" packages/natives/native/

         - name: Check
           if: steps.ready.outputs.ready == 'true'
           run: bun run check:ts
         - name: Zen tests
           if: steps.ready.outputs.ready == 'true'
           run: bun scripts/zen/run-tests.ts

         - name: Push zen/main
           if: steps.ready.outputs.ready == 'true'
           env:
              OLD: ${{ steps.rebase.outputs.old }}
           run: git push --force-with-lease="zen/main:$OLD" origin zen/main

         # workflow_dispatch (not workflow_call): npm trusted publishing validates the top-level workflow file.
         - name: Release
           if: steps.ready.outputs.ready == 'true'
           env:
              NEW: ${{ steps.rebase.outputs.new }}
              REPO: ${{ github.repository }}
           run: |
              started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              gh workflow run zen-release.yml --ref zen/main -R "$REPO"
              run_id=""
              for _ in $(seq 1 30); do
                 run_id="$(gh run list -R "$REPO" --workflow zen-release.yml --event workflow_dispatch --branch zen/main \
                    --json databaseId,headSha,createdAt \
                    --jq "[.[] | select(.headSha == \"$NEW\" and .createdAt >= \"$started\")] | sort_by(.createdAt) | last | .databaseId // empty")"
                 [ -n "$run_id" ] && break
                 sleep 5
              done
              [ -n "$run_id" ] || { echo "zen-release run did not appear"; exit 1; }
              echo "zen-release run: $run_id" >> "$GITHUB_STEP_SUMMARY"
              gh run watch "$run_id" -R "$REPO" --exit-status

         - name: Disable zen-follow after failure
           if: failure()
           env:
              REPO: ${{ github.repository }}
           run: gh workflow disable zen-follow.yml -R "$REPO"
